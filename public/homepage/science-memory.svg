<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="memBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDFBF9" />
      <stop offset="1" stop-color="#F5EFEA" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="20" fill="url(#memBg)" stroke="#200110" stroke-opacity="0.08" />

  <!-- Connecting Graph Edges -->
  <line x1="200" y1="120" x2="100" y2="70" stroke="#80103A" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="4 4" />
  <line x1="200" y1="120" x2="300" y2="70" stroke="#0F766E" stroke-width="2.5" stroke-opacity="0.6" />
  <line x1="200" y1="120" x2="110" y2="175" stroke="#0F766E" stroke-width="2.5" stroke-opacity="0.6" />
  <line x1="200" y1="120" x2="290" y2="175" stroke="#F4A261" stroke-width="2" stroke-opacity="0.5" />
  <line x1="100" y1="70" x2="50" y2="120" stroke="#200110" stroke-opacity="0.15" />
  <line x1="300" y1="70" x2="350" y2="120" stroke="#200110" stroke-opacity="0.15" />

  <!-- Central Hub: Autobiographical Memory -->
  <circle cx="200" cy="120" r="32" fill="#200110" />
  <circle cx="200" cy="120" r="36" stroke="#200110" stroke-opacity="0.15" stroke-width="2" />
  <text x="200" y="117" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">LIFE</text>
  <text x="200" y="130" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#CAB8C1" text-anchor="middle">MEMORY</text>

  <!-- Node 1: Primary School / Early Life -->
  <g transform="translate(100, 70)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#80103A" stroke-width="2" />
    <text x="0" y="3" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🏫</text>
    <rect x="-35" y="26" width="70" height="18" rx="6" fill="#FFFFFF" stroke="#200110" stroke-opacity="0.08" />
    <text x="0" y="39" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#200110" text-anchor="middle">Early Life</text>
  </g>

  <!-- Node 2: Wedding / Family Event (Direct Match) -->
  <g transform="translate(300, 70)">
    <circle cx="0" cy="0" r="24" fill="#0F766E" />
    <text x="0" y="4" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">💍</text>
    <rect x="-42" y="28" width="84" height="18" rx="6" fill="#0F766E" />
    <text x="0" y="41" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Direct Match ✓</text>
  </g>

  <!-- Node 3: Daily Routine / Temple (Cued Match) -->
  <g transform="translate(110, 175)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" />
    <text x="0" y="4" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🪔</text>
    <rect x="-40" y="-30" width="80" height="18" rx="6" fill="#FFFFFF" stroke="#200110" stroke-opacity="0.08" />
    <text x="0" y="-18" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#200110" text-anchor="middle">Cued Match ✓</text>
  </g>

  <!-- Node 4: Distractor Rejection -->
  <g transform="translate(290, 175)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#F4A261" stroke-width="2" />
    <text x="0" y="4" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🛡️</text>
    <rect x="-45" y="-30" width="90" height="18" rx="6" fill="#FFFFFF" stroke="#200110" stroke-opacity="0.08" />
    <text x="0" y="-18" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#200110" text-anchor="middle">Distractor Filter</text>
  </g>
</svg>
