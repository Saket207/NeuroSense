<svg width="480" height="280" viewBox="0 0 480 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matchBg" x1="0" y1="0" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A0518" />
      <stop offset="1" stop-color="#1A010D" />
    </linearGradient>
  </defs>

  <rect width="480" height="280" rx="20" fill="url(#matchBg)" stroke="rgba(255,255,255,0.1)" />

  <!-- Stage Pipeline Flow -->
  <g transform="translate(30, 30)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="125" height="150" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <span fill="#F4F08A">
      <circle cx="20" cy="24" r="10" fill="#F4F08A" />
      <text x="20" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#200110" text-anchor="middle">1</text>
    </span>
    <text x="36" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Direct Recall</text>
    <text x="12" y="55" font-family="Inter, sans-serif" font-size="10" fill="#CAB8C1">Spontaneous</text>
    <text x="12" y="70" font-family="Inter, sans-serif" font-size="10" fill="#CAB8C1">spoken answer</text>
    <rect x="12" y="95" width="101" height="32" rx="6" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" />
    <text x="62" y="115" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#4ADE80" text-anchor="middle">+1.0 Exact Match</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M162 105 L178 105" stroke="#F4F08A" stroke-width="2" stroke-linecap="round" />
  <path d="M174 100 L180 105 L174 110" stroke="#F4F08A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <g transform="translate(185, 30)">
    <!-- Stage 2 -->
    <rect x="0" y="0" width="125" height="150" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="20" cy="24" r="10" fill="#F4F08A" />
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#200110" text-anchor="middle">2</text>
    <text x="36" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Semantic Cues</text>
    <text x="12" y="55" font-family="Inter, sans-serif" font-size="10" fill="#CAB8C1">Gentle verbal</text>
    <text x="12" y="70" font-family="Inter, sans-serif" font-size="10" fill="#CAB8C1">prompt provided</text>
    <rect x="12" y="95" width="101" height="32" rx="6" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" />
    <text x="62" y="115" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">+0.6 Cued Recall</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M317 105 L333 105" stroke="#F4F08A" stroke-width="2" stroke-linecap="round" />
  <path d="M329 100 L335 105 L329 110" stroke="#F4F08A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <g transform="translate(340, 30)">
    <!-- Stage 3 -->
    <rect x="0" y="0" width="115" height="150" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <circle cx="20" cy="24" r="10" fill="#F4F08A" />
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#200110" text-anchor="middle">3</text>
    <text x="36" y="28" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Distractor Filter</text>
    <text x="12" y="55" font-family="Inter, sans-serif" font-size="10" fill="#CAB8C1">Plausible lure</text>
    <text x="12" y="70" font-family="Inter, sans-serif" font-size="10" fill="#CAB8C1">differentiation</text>
    <rect x="12" y="95" width="91" height="32" rx="6" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.4)" />
    <text x="57" y="115" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="middle">+0.4 Recognition</text>
  </g>

  <!-- Bottom Result Banner -->
  <rect x="30" y="200" width="420" height="52" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" />
  <text x="50" y="231" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Unified Result Score</text>
  <text x="240" y="231" font-family="Inter, sans-serif" font-size="11" fill="#CAB8C1">Recall (0.40) + Acoustic (0.35) + Family Obs (0.25)</text>
  <rect x="390" y="214" width="48" height="24" rx="6" fill="#F4F08A" />
  <text x="414" y="230" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#200110" text-anchor="middle">88%</text>
</svg>
